<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Contact Lists</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #029c09;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .no-data {
      color: gray;
      font-style: italic;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .actions button {
      padding: 6px 12px;
      cursor: pointer;
    }

    .edit-btn {
      background-color: #1004bf;
      border: none;
      color: white;
      transition: background-color 0.3s ease;
    }
    .edit-btn:hover {
      background-color: #0d018f;
    }

    .delete-btn {
      background-color: #bf0404;
      border: none;
      color: white;
      transition: background-color 0.3s ease;
    }
    .delete-btn:hover {
      background-color: #9e0303;
    }

    .add-contact-btn {
      margin-top: 20px;
      margin-bottom: 10px;
      padding: 10px 20px;
      background-color: #029c09;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .add-contact-btn:hover {
      background-color: #038709;
    }
  </style>
</head>
<body>

<h2>Contact Lists</h2>

<form action="/add-contact" method="get">
  <button type="submit" class="add-contact-btn">Add Contact</button>
</form>

<table>
  <thead>
  <tr>
    <th>Name</th>
    <th>Email Address</th>
    <th>Phone Number</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="contact : ${contacts}">
    <td th:text="${contact.names != null and #lists.size(contact.names) > 0 ? contact.names[0].displayName : 'No name'}"></td>
    <td>
        <span th:if="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}"
              th:text="${contact.emailAddresses[0].value}"></span>
      <span th:unless="${contact.emailAddresses != null and #lists.size(contact.emailAddresses) > 0}" class="no-data">No email</span>
    </td>
    <td>
        <span th:if="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}"
              th:text="${contact.phoneNumbers[0].value}"></span>
      <span th:unless="${contact.phoneNumbers != null and #lists.size(contact.phoneNumbers) > 0}" class="no-data">No phone</span>
    </td>
    <td class="actions">

      <form th:action="@{/Edit}" method="get" style="margin: 0;">
        <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
        <button type="submit" class="edit-btn">Edit</button>
      </form>


      <form th:action="@{/delete-contact}" method="post" style="margin: 0;">
        <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
        <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this contact?');">Delete</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
