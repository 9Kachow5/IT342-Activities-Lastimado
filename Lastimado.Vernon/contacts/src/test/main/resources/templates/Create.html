<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Contact</title>
  <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h2 {
            text-align: center;
        }


        .form-container {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #ccc; /* Box border */
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            margin-bottom: 15px;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
            text-align: center;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
        .centered-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .centered-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<h2>Create New Contact</h2>


<div class="form-container">
  <form action="/contacts" method="post">
    <label for="givenName">Given Name:</label>
    <input type="text" id="givenName" name="givenName" required><br>

    <label for="familyName">Family Name:</label>
    <input type="text" id="familyName" name="familyName" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br>

    <label for="phoneNumber">Phone Number:</label>
    <input type="tel" id="phoneNumber" name="phoneNumber"><br>

    <button type="submit">Save Contact</button>
  </form>
</div>

<a href="/contacts" class="centered-link">Back to Contacts</a>

</body>
</html>
